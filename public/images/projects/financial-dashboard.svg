<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#101827"/>
  <rect x="2" y="2" width="796" height="446" rx="14" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Header bar -->
  <rect x="40" y="30" width="720" height="40" rx="8" fill="#131E30"/>
  <circle cx="65" cy="50" r="6" fill="#EF4444"/>
  <circle cx="85" cy="50" r="6" fill="#F59E0B"/>
  <circle cx="105" cy="50" r="6" fill="#10B981"/>
  <text x="135" y="55" font-family="Space Grotesk, sans-serif" font-size="14" fill="#94A3B8" font-weight="500">Financial Performance Dashboard — Power BI</text>

  <!-- KPI Cards -->
  <rect x="40" y="90" width="160" height="80" rx="8" fill="#131E30" stroke="#3B82F6" stroke-opacity="0.2"/>
  <text x="55" y="115" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Total Revenue</text>
  <text x="55" y="145" font-family="Space Grotesk, sans-serif" font-size="20" fill="#3B82F6" font-weight="700">$2.94M</text>

  <rect x="225" y="90" width="160" height="80" rx="8" fill="#131E30" stroke="#22D3EE" stroke-opacity="0.2"/>
  <text x="240" y="115" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Net Profit</text>
  <text x="240" y="145" font-family="Space Grotesk, sans-serif" font-size="20" fill="#22D3EE" font-weight="700">$930K</text>

  <rect x="410" y="90" width="160" height="80" rx="8" fill="#131E30" stroke="#10B981" stroke-opacity="0.2"/>
  <text x="425" y="115" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Profit Margin</text>
  <text x="425" y="145" font-family="Space Grotesk, sans-serif" font-size="20" fill="#10B981" font-weight="700">31.6%</text>

  <rect x="595" y="90" width="165" height="80" rx="8" fill="#131E30" stroke="#F59E0B" stroke-opacity="0.2"/>
  <text x="610" y="115" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Operating Expense</text>
  <text x="610" y="145" font-family="Space Grotesk, sans-serif" font-size="20" fill="#F59E0B" font-weight="700">$2.01M</text>

  <!-- Big Area Chart -->
  <rect x="40" y="190" width="450" height="220" rx="8" fill="#131E30"/>
  <path d="M60 360 C 120 330, 180 340, 240 280 C 300 300, 360 250, 450 230 L 450 380 L 60 380 Z" fill="url(#blueGrad)" opacity="0.4"/>
  <path d="M60 360 C 120 330, 180 340, 240 280 C 300 300, 360 250, 450 230" stroke="#3B82F6" stroke-width="3" fill="none"/>
  
  <path d="M60 375 C 120 360, 180 365, 240 330 C 300 340, 360 310, 450 300 L 450 380 L 60 380 Z" fill="url(#cyanGrad)" opacity="0.3"/>
  <path d="M60 375 C 120 360, 180 365, 240 330 C 300 340, 360 310, 450 300" stroke="#22D3EE" stroke-width="2" fill="none"/>

  <!-- Donut Chart -->
  <rect x="510" y="190" width="250" height="220" rx="8" fill="#131E30"/>
  <circle cx="635" cy="285" r="55" stroke="#1E293B" stroke-width="20" fill="none"/>
  <circle cx="635" cy="285" r="55" stroke="#3B82F6" stroke-width="20" stroke-dasharray="140 360" fill="none"/>
  <circle cx="635" cy="285" r="55" stroke="#22D3EE" stroke-width="20" stroke-dasharray="80 360" stroke-dashoffset="-140" fill="none"/>
  <circle cx="635" cy="285" r="55" stroke="#F59E0B" stroke-width="20" stroke-dasharray="50 360" stroke-dashoffset="-220" fill="none"/>
  <text x="635" y="290" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" fill="#F8FAFC" font-weight="600">Expenses</text>

  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
