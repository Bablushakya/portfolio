<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#101827"/>
  <rect x="2" y="2" width="796" height="446" rx="14" stroke="#EC4899" stroke-opacity="0.3" stroke-width="2"/>
  
  <rect x="40" y="30" width="720" height="40" rx="8" fill="#131E30"/>
  <circle cx="65" cy="50" r="6" fill="#EF4444"/>
  <circle cx="85" cy="50" r="6" fill="#F59E0B"/>
  <circle cx="105" cy="50" r="6" fill="#10B981"/>
  <text x="135" y="55" font-family="Space Grotesk, sans-serif" font-size="14" fill="#94A3B8" font-weight="500">Customer Churn Analysis — Python &amp; SQL</text>

  <!-- Churn Rate Bar visualization -->
  <rect x="40" y="90" width="720" height="320" rx="8" fill="#131E30"/>
  <text x="65" y="125" font-family="Space Grotesk, sans-serif" font-size="16" fill="#F8FAFC" font-weight="600">Churn Rate by Contract Tenure &amp; Service Bundle</text>

  <!-- Bars -->
  <rect x="80" y="160" width="90" height="180" rx="6" fill="#EC4899" opacity="0.9"/>
  <text x="125" y="360" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Month-to-Month</text>
  <text x="125" y="150" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" fill="#EC4899" font-weight="700">42%</text>

  <rect x="230" y="280" width="90" height="60" rx="6" fill="#3B82F6" opacity="0.9"/>
  <text x="275" y="360" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">One Year</text>
  <text x="275" y="270" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" fill="#3B82F6" font-weight="700">11%</text>

  <rect x="380" y="320" width="90" height="20" rx="6" fill="#10B981" opacity="0.9"/>
  <text x="425" y="360" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Two Year</text>
  <text x="425" y="310" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" fill="#10B981" font-weight="700">3%</text>

  <!-- Insights panel -->
  <rect x="520" y="160" width="220" height="180" rx="8" fill="#080D18" stroke="#334155"/>
  <text x="535" y="190" font-family="Space Grotesk, sans-serif" font-size="13" fill="#22D3EE" font-weight="600">Key Risk Drivers:</text>
  <text x="535" y="220" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• High monthly electronic check</text>
  <text x="535" y="245" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• Zero tech support add-on</text>
  <text x="535" y="270" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• First 90 days tenure window</text>
  <text x="535" y="300" font-family="Inter, sans-serif" font-size="11" fill="#10B981">• Retention potential: +18%</text>
